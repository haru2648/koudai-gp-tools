<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイムカウンター</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        :root {
            --main-purple: #76499F;
            --light-purple: #E7CBFF;
            --accent-orange: #f5a623;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            min-width: 320px;
        }
        #counter-title {
            font-size: 1.8em;
            color: var(--main-purple);
            margin-top: 0;
            margin-bottom: 25px;
            word-break: break-all;
        }
        #counter {
            font-size: 6rem;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
            line-height: 1;
        }
        .button-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px; /* ボタンの間の隙間 */
        }
        .counter-btn {
            width: 120px;
            padding: 15px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.1s;
        }
        .counter-btn:active {
            transform: scale(0.98);
        }
        #incrementButton {
            background-color: var(--main-purple);
            color: white;
        }
        #incrementButton:hover {
            background-color: #613d85;
        }
        #decrementButton {
            background-color: var(--accent-orange);
            color: white;
        }
        #decrementButton:hover {
            background-color: #d48e1c;
        }
        #decrementButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .error-message {
            color: #d90000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="counter-title">...</h1>
        <div id="counter">0</div>
        <!-- ボタンをまとめるラッパーを追加 -->
        <div class="button-wrapper">
            <button id="decrementButton" class="counter-btn">-1</button>
            <button id="incrementButton" class="counter-btn">+1</button>
        </div>
    </div>

    <!-- Firebase SDK の読み込み (v9 modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        // ▼▼▼▼▼ ここはあなたの既存のFirebaseプロジェクト設定に書き換えてください ▼▼▼▼▼
        const firebaseConfig = {
          apiKey: "AIzaSyA3ZZ_T7OGkJ4z2gA9wOjJCGRIwFCewbzQ",
          authDomain: "koudaisai-gp-2025.firebaseapp.com",
          projectId: "koudaisai-gp-2025",
          databaseURL: "https://koudaisai-gp-2025-default-rtdb.firebaseio.com",
          storageBucket: "koudaisai-gp-2025.firebasestorage.app",
          messagingSenderId: "821603922081",
          appId: "1:821603922081:web:3697ea3356f6bcf689c0e0"
        };
        // ▲▲▲▲▲ ここまで ▲▲▲▲▲

        // --- ここから下がカウンターのプログラムです ---

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const titleElement = document.getElementById('counter-title');
        const counterElement = document.getElementById('counter');
        const incrementButton = document.getElementById('incrementButton');
        const decrementButton = document.getElementById('decrementButton'); // マイナスボタンを取得
        const buttonWrapper = document.querySelector('.button-wrapper');

        const params = new URLSearchParams(window.location.search);
        const counterId = params.get('id');

        if (!counterId) {
            titleElement.textContent = 'エラー';
            counterElement.innerHTML = '<span class="error-message">カウンターIDが指定されていません。<br>URLの末尾に ?id=名前 の形式で指定してください。</span>';
            counterElement.style.fontSize = "1rem";
            buttonWrapper.style.display = 'none';
        } else {
            titleElement.textContent = `${counterId}`;
            
            const counterRef = ref(database, 'counters/' + counterId);

            // データベースの値が変更されたら、画面を更新
            onValue(counterRef, (snapshot) => {
                const data = snapshot.val();
                const count = data ? data.count : 0;
                counterElement.textContent = count;

                // カウントが0以下ならマイナスボタンを無効化
                decrementButton.disabled = count <= 0;
            });

            // プラスボタンが押されたら、安全に値を+1する
            incrementButton.addEventListener('click', () => {
                runTransaction(counterRef, (currentData) => {
                    if (currentData === null) {
                        return { count: 1 };
                    } else {
                        return { count: currentData.count + 1 };
                    }
                });
            });

            // ★★★ マイナスボタンが押されたときの処理を追加 ★★★
            decrementButton.addEventListener('click', () => {
                runTransaction(counterRef, (currentData) => {
                    // データが存在し、かつカウントが0より大きい場合のみ処理
                    if (currentData && currentData.count > 0) {
                        return { count: currentData.count - 1 };
                    }
                    // そうでなければ何もしない（トランザクションを中断）
                    return;
                });
            });
        }
    </script>

</body>
</html>
